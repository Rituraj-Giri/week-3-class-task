```html
<!DOCTYPE html>
<html>
<head>
    <title>Lists and Division</title>
</head>
<body>

    <h1>HTML Lists</h1>

    <h2>Unordered List</h2>
    <ul>
        <li>Bread</li>
        <li>Butter</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Tea</li>
        <li>Coffee</li>
    </ol>

    <h2>Description List</h2>
    <dl>
        <dt>Bread</dt>
        <dd>Wheat</dd>
        <dd>Rye</dd>

        <dt>Butter</dt>
        <dd>Salted</dd>
    </dl>

    <h2>Division</h2>

    <div>
        <p>This is a division of content.</p>
        <p>The div tag is used to group and separate areas of content.</p>
    </div>

</body>
</html>
```
